<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimum Human Quota</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body class="pre">
<div id="app">
  <header>
    <div id="brand"></div>
    <div id="compliance"></div>
    <div><span id="hdr"></span> <b id="hdr-time"></b> <button id="mute" class="mini"></button></div>
  </header>
  <div id="timer"><div></div></div>

  <!-- left: the worker -->
  <aside id="left">
    <div id="avatar" class="avatar">
      <p><b id="worker-title"></b></p>
    </div>
    <p class="label" id="lbl-chain"></p><p class="stat" id="chain-text"></p>
    <div class="bar"><div id="chain-bar"></div></div>
    <p class="label" id="lbl-resets"></p><p class="stat" id="resets"></p>
  </aside>

  <!-- centre: intro screens, then the work -->
  <main id="main"></main>
</div>

<!-- the screen fades as the worker disappears -->
<div id="veil"></div>

<!-- the workers' messages: popups that appear next to the task -->
<div id="popups" hidden></div>

<!-- full-screen moments: reset, game over, endings -->
<div id="overlay" hidden></div>

<script src="content.js?v=6"></script>
<script src="sound.js?v=6"></script>
<script src="tasks.js?v=6"></script>
<script src="story.js?v=6"></script>
<script src="game.js?v=6"></script>
</body>
</html>
